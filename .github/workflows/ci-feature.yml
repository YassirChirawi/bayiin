name: CI Feature

on:
  push:
    branches:
      - 'feature/**'
      - 'chore/**'
      - 'fix/**'
      - 'hotfix/**'

concurrency:
  group: ci-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Unit Tests + Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Unit Tests
        run: npm run test -- --run
        env:
          NODE_ENV: test

      - name: Build Check
        run: npm run build
        env:
          CI: false
