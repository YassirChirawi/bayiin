name: CI Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  ci-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest unit + integration tests
        run: npm run test:unit && npm run test:integration
        continue-on-error: true

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start Firebase Emulator & Run E2E
        run: |
          npm install -g firebase-tools
          firebase emulators:start --only firestore,auth &
          sleep 10
          npm run test:e2e
        env:
          BASE_URL: http://localhost:5173

      - name: Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Deploy staging Firebase Hosting
        run: firebase hosting:channel:deploy staging --token ${{ secrets.FIREBASE_TOKEN }}

      - name: Post PR Comment
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ CI Develop passed successfully! Staging environment has been deployed.'
            })
