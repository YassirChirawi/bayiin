name: CI Develop

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Full Quality Gate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for SonarCloud

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # ── ESLint with Report ──
      - name: ESLint with Report
        run: |
          npm run lint -- --format json --output-file eslint-report.json || true
          npm run lint

      - name: Upload ESLint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: eslint-report.json

      # ── Unit Tests + Coverage ──
      - name: Unit Tests with Coverage
        run: npm run test -- --run --coverage
        env:
          NODE_ENV: test

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      # ── Snyk Security Scan ──
      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json-file-output=snyk-report.json
        continue-on-error: true

      - name: Upload Snyk Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-report
          path: snyk-report.json

      # ── SonarCloud Quality Gate ──
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=YassirChirawi_bayiin
            -Dsonar.organization=yassirchirawi
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/tests/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
        continue-on-error: true

      # ── Build Check ──
      - name: Production Build
        run: npm run build
        env:
          CI: false

      - name: Check Bundle Size
        run: |
          BUILD_SIZE=$(du -sk dist/ | cut -f1)
          echo "📦 Bundle size: ${BUILD_SIZE}KB"
          if [ $BUILD_SIZE -gt 5000 ]; then
            echo "⚠️ Bundle size exceeds 5MB — consider code splitting"
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          CI: true
        continue-on-error: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
