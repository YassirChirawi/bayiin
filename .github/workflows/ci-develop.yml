name: CI Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  ci-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Les emulateurs Firebase tournent sur la JVM, et scripts/emulator-test.mjs
      # exige un JDK >= 21 (il sort en erreur sinon). L'image ubuntu-latest ne
      # garantit pas cette version par defaut : on la fixe explicitement, sinon
      # les suites qui dependent des emulateurs echouent avant de commencer.
      - name: Setup Java 21 (emulateurs Firebase)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # `continue-on-error: true` rendait cette etape purement decorative :
      # les tests pouvaient echouer sans rien bloquer. Retire.
      - name: Vitest unit + integration tests
        run: npm run test:unit && npm run test:integration

      # Les tests de regles couvrent les gardes de securite (P0-5 auto-attribution
      # de plan, anti-escalade RBAC allowed_users). Ils existaient depuis
      # longtemps sans etre executes nulle part.
      - name: Firestore rules tests
        run: npm run test:rules

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start Firebase Emulator & Run E2E
        run: |
          npm install -g firebase-tools
          firebase emulators:start --only firestore,auth &
          sleep 10
          npm run test:e2e
        env:
          BASE_URL: http://localhost:5173

      - name: Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Deploy staging Firebase Hosting
        run: firebase hosting:channel:deploy staging --token ${{ secrets.FIREBASE_TOKEN }}

      # Garde anti-derive : `firebase deploy --only firestore:rules` affiche
      # "Deploy complete!" sans rien publier en configuration multi-base. Les
      # regles de production ont ainsi pris 85 lignes de retard sans que rien
      # ne le signale. Cette etape echoue si la production a derive.
      - name: Verifier les regles Firestore deployees
        run: node scripts/verify-firestore-rules.mjs
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        continue-on-error: true

      - name: Post PR Comment
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ CI Develop passed successfully! Staging environment has been deployed.'
            })
