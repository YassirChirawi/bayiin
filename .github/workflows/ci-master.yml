name: CI Master

on:
  push:
    branches:
      - master

jobs:
  ci-master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Suite complète non-régression Playwright
        run: npm run test:regression
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL || 'http://localhost:5173' }}

      - name: Snyk scan final
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=critical

      - name: Vite build production
        run: npm run build

      - name: Auto-tag version
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Génération CHANGELOG automatique
        uses: conventional-changelog/github-action@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Hosting production
        run: firebase deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }}

      # Les regles Firestore ne faisaient partie d'AUCUN deploiement automatise :
      # elles devaient etre publiees a la main, et `firebase deploy --only
      # firestore:rules` affiche "Deploy complete!" sans rien publier en
      # configuration multi-base. Resultat : la production a accumule 85 lignes
      # de retard, dont deux correctifs de securite, sans aucun signal.
      #
      # Le script passe par l'API Rules et contourne ce bug. La verification qui
      # suit est BLOQUANTE : une release ne doit pas etre annoncee livree si les
      # regles n'ont pas suivi.
      - name: Deploy Firestore rules (API Rules, contourne le bug CLI)
        run: node scripts/deploy-firestore-rules.mjs --apply
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Verifier que les regles sont bien actives
        run: node scripts/verify-firestore-rules.mjs
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
